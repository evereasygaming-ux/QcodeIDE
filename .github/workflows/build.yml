name: build

# Continuous, unsigned debug build of QCode. This is the "one time build" gate for
# every phase: it must stay green before a phase is considered done. It mirrors the
# toolchain the release workflow pins (JDK 21, compileSdk 36, NDK, CMake >= 3.24,
# Rust for the wasmtime/ripgrep FFI) but produces an installable debug APK artifact
# instead of publishing a signed release.
#
# NOTE: we deliberately do NOT use android-actions/setup-android. That action is on the
# Node 20 runtime, is forced onto Node 24 and fails. The ubuntu-latest image already
# ships the Android SDK + cmdline-tools, so we drive `sdkmanager` directly.
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  NDK_VERSION: '27.2.12479018'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      # wasmtime's build tree plus the NDK is more than the runner has spare with the
      # preinstalled toolchains still on it.
      - name: Make room on the runner
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost || true
          df -h /

      # Builds the vendored agy_ide_bridge (agent/bridge, module gemini-server) as a static
      # Linux/arm64 binary. Its go.mod requires a recent toolchain; `stable` satisfies it.
      - uses: actions/setup-go@v5
        with:
          go-version: 'stable'
          cache: true
          cache-dependency-path: agent/bridge/go.sum

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Install the SDK pieces the build pins
        run: |
          set -eu
          # Preinstalled SDK on the runner image.
          ANDROID_HOME="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          [ -d "$ANDROID_HOME" ] || { echo "::error::Android SDK not found at $ANDROID_HOME"; ls /usr/local/lib/android 2>/dev/null || true; exit 1; }
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"

          sdkmanager="$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1)"
          [ -n "$sdkmanager" ] || { echo "::error::sdkmanager not found under $ANDROID_HOME/cmdline-tools"; ls "$ANDROID_HOME" 2>/dev/null || true; exit 1; }
          echo "$(dirname "$sdkmanager")" >> "$GITHUB_PATH"

          yes | "$sdkmanager" --licenses >/dev/null 2>&1 || true
          "$sdkmanager" --install \
            "platforms;android-36" \
            "build-tools;34.0.0" \
            "ndk;${NDK_VERSION}"

          usable="$(ls "$ANDROID_HOME/cmake" 2>/dev/null | awk -F. '$1 * 100000 + $2 >= 300024' | tail -1)"
          [ -n "$usable" ] || { echo "::error::no installed CMake is 3.24 or above"; ls "$ANDROID_HOME/cmake" 2>/dev/null || true; exit 1; }
          echo "CMake the build will use: $usable"

      - name: Set up Rust for Android
        run: |
          set -eu
          rustup target add aarch64-linux-android
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"

      - name: Cache the Rust build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry
            ~/.cargo/git
            native/ripgrep-ffi/rust/target
            native/wasmtime-ffi/rust/target
          key: cargo-android-debug-${{ runner.os }}-${{ hashFiles('native/**/Cargo.lock', 'native/**/Cargo.toml') }}
          restore-keys: cargo-android-debug-${{ runner.os }}-

      - name: Install cargo-ndk
        run: command -v cargo-ndk >/dev/null 2>&1 || cargo install cargo-ndk --locked

      - name: Build the Rust JNI libraries (debug)
        run: ./gradlew --no-daemon :native:ripgrep-ffi:cargoBuildDebugJniLibs :native:wasmtime-ffi:cargoBuildDebugJniLibs

      # Compile before assembling: a Kotlin error then surfaces in minutes instead of after the
      # packaging stages, and the assemble run below is incremental anyway.
      - name: Compile the Kotlin sources
        run: |
          set -o pipefail
          ./gradlew --no-daemon :app:compileDebugKotlin 2>&1 | tee /tmp/kotlin.log

      - name: Assemble the debug APK
        run: |
          set -o pipefail
          ./gradlew --no-daemon :app:assembleDebug 2>&1 | tee /tmp/assemble.log

      # Phase 5 turns R8 on for `release`, and shipping a variant nobody assembles is how a
      # minified release breaks unnoticed. This builds the release JNI libraries and assembles the
      # whole variant, so a missing keep rule, a resource the shrinker removed, or a release-only
      # compile error fails CI here instead of in a signed release.
      - name: Build the Rust JNI libraries (release)
        run: ./gradlew --no-daemon :native:ripgrep-ffi:cargoBuildReleaseJniLibs :native:wasmtime-ffi:cargoBuildReleaseJniLibs

      - name: Assemble the release APK under R8
        run: |
          set -o pipefail
          ./gradlew --no-daemon :app:assembleRelease 2>&1 | tee /tmp/r8.log

      # The real signing key lives in the admin-only `release` environment, so the workflow cannot
      # produce the shipping APK. It can still produce an *installable* minified build by signing
      # with the debug keystore: enough to verify on a device that R8 kept every extension-facing
      # name, and otherwise throwaway.
      - name: Sign the release build with the debug key for testing
        run: |
          set -eu
          apk="$(find app/build/outputs/apk/release -name '*.apk' | head -1)"
          [ -n "$apk" ] || { echo "::error::no release APK produced"; exit 1; }
          keystore="$HOME/.android/debug.keystore"
          [ -f "$keystore" ] || { echo "::error::debug keystore missing at $keystore"; exit 1; }
          aligned=app/build/outputs/apk/release/app-release-test-aligned.apk
          out=app/build/outputs/apk/release/app-release-test.apk
          "$ANDROID_HOME/build-tools/34.0.0/zipalign" -f -p 4 "$apk" "$aligned"
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" sign \
            --ks "$keystore" --ks-pass pass:android --key-pass pass:android \
            --ks-key-alias androiddebugkey --out "$out" "$aligned"
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --print-certs "$out" | head -4
          ls -l app/build/outputs/apk/debug/*.apk "$out"

      # The run log needs an authenticated session to read, so on failure the compiler's own
      # lines are echoed into the job summary — that is public for a public repo and is enough to
      # see the first `e:` without another round trip.
      - name: Report the Gradle failure
        if: failure()
        run: |
          # Whichever log was written last is the step that failed.
          log="$(ls -t /tmp/kotlin.log /tmp/assemble.log /tmp/r8.log 2>/dev/null | head -1)"
          [ -n "$log" ] && [ -s "$log" ] || exit 0
          # The run log needs a session; annotations are readable on a public repo without one, so
          # the first compiler errors are raised as annotations as well as put in the summary.
          grep -E '^e: ' "$log" | head -6 | while IFS= read -r line; do
            printf '::error::%s\n' "${line//'%'/'%25'}"
          done
          # R8 reports missing classes and rule problems on their own lines.
          grep -E '^Missing class |^ERROR: |^Error: |^Warning: ' "$log" | head -6 | while IFS= read -r line; do
            printf '::error::%s\n' "${line//'%'/'%25'}"
          done
          grep -E '^> Task .* FAILED|^FAILURE:|Execution failed for task|^Caused by: ' "$log" | head -4 | while IFS= read -r line; do
            printf '::error::%s\n' "${line//'%'/'%25'}"
          done
          {
            echo '## Gradle failure'
            echo
            echo '```'
            grep -E '^e: |^w: .*(error|Error)|error:|^Missing class |^ERROR: |^Warning: |FAILURE:|What went wrong|Execution failed for task|Caused by:|Could not (resolve|find|create|download)|> Task .* FAILED|A problem occurred' "$log" | head -120 || true
            echo '```'
            echo
            echo '<details><summary>Tail of the build log</summary>'
            echo
            echo '```'
            tail -200 "$log" || true
            echo '```'
            echo '</details>'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the debug APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qcode-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn

      - name: Upload the release test APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qcode-release-test-apk
          path: app/build/outputs/apk/release/app-release-test.apk
          if-no-files-found: warn

      - name: Show the APK identity
        run: |
          set -eu
          for variant in debug release; do
            apk="$(find "app/build/outputs/apk/$variant" -name '*.apk' ! -name '*aligned*' 2>/dev/null | head -1)" || true
            [ -n "$apk" ] || { echo "no $variant APK produced"; continue; }
            echo "APK ($variant): $apk — $(stat -c %s "$apk") bytes"
            "$ANDROID_HOME/build-tools/34.0.0/aapt2" dump badging "$apk" | grep -E "package:|application-label" || true
          done
