name: build

# Continuous, unsigned debug build of QCode. This is the "one time build" gate for
# every phase: it must stay green before a phase is considered done. It mirrors the
# toolchain the release workflow pins (JDK 21, compileSdk 36, NDK, CMake >= 3.24,
# Rust for the wasmtime/ripgrep FFI) but produces an installable debug APK artifact
# instead of publishing a signed release.
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  NDK_VERSION: '27.2.12479018'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      # wasmtime's build tree plus the NDK is more than the runner has spare with the
      # preinstalled toolchains still on it.
      - name: Make room on the runner
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost || true
          df -h /

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - uses: android-actions/setup-android@v3

      - name: Install the SDK pieces the build pins
        run: |
          set -eu
          sdkmanager --install \
            "platforms;android-36" \
            "build-tools;34.0.0" \
            "ndk;${NDK_VERSION}"
          [ -n "${ANDROID_HOME:-}" ] || { echo "::error::ANDROID_HOME is unset"; exit 1; }
          usable="$(ls "$ANDROID_HOME/cmake" 2>/dev/null | awk -F. '$1 * 100000 + $2 >= 300024' | tail -1)"
          [ -n "$usable" ] || { echo "::error::no installed CMake is 3.24 or above"; exit 1; }
          echo "CMake the build will use: $usable"

      - name: Set up Rust for Android
        run: |
          set -eu
          rustup target add aarch64-linux-android
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"

      - name: Cache the Rust build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry
            ~/.cargo/git
            native/ripgrep-ffi/rust/target
            native/wasmtime-ffi/rust/target
          key: cargo-android-debug-${{ runner.os }}-${{ hashFiles('native/**/Cargo.lock', 'native/**/Cargo.toml') }}
          restore-keys: cargo-android-debug-${{ runner.os }}-

      - name: Install cargo-ndk
        run: command -v cargo-ndk >/dev/null 2>&1 || cargo install cargo-ndk --locked

      - name: Build the Rust JNI libraries (debug)
        run: ./gradlew --no-daemon :native:ripgrep-ffi:cargoBuildDebugJniLibs :native:wasmtime-ffi:cargoBuildDebugJniLibs

      - name: Assemble the debug APK
        run: ./gradlew --no-daemon :app:assembleDebug

      - name: Upload the debug APK
        uses: actions/upload-artifact@v4
        with:
          name: qcode-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Show the APK identity
        run: |
          set -eu
          apk="$(find app/build/outputs/apk/debug -name '*.apk' | head -1)"
          echo "APK: $apk"
          "$ANDROID_SDK_ROOT/build-tools/34.0.0/aapt2" dump badging "$apk" | grep -E "package:|application-label" || true
